# Pipeline GitHub Actions de la démo CI/CD.
# Mêmes étapes, même ordre et mêmes noms de jobs que .gitlab-ci.yml
# (voir docs/contrats/choix-techniques.md). Étapes 1 à 5 : issue #9.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.21.2"
  SEMGREP_IMAGE: "semgrep/semgrep:1.95.0"
  TRIVY_IMAGE: "aquasec/trivy:0.57.1"

jobs:
  # 1. lint — ruff
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-cicd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --only-binary=":all:" -r requirements-dev.txt
      - run: ruff check .

  # 2. test — pytest
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: demo-cicd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --only-binary=":all:" -r requirements-dev.txt
      - run: pytest -v

  # 3. secrets — Gitleaks sur tout l'historique git
  secrets:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl --proto "=https" --tlsv1.2 -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks git --redact --verbose .

  # 4. sast — Semgrep (règles Python publiques)
  sast:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep on demo-cicd
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/python --error --metrics off demo-cicd/

  # 5. deps — Trivy sur requirements.txt (échec si vulnérabilité CRITICAL)
  deps:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - name: Trivy on requirements.txt
        run: |
          docker run --rm -v "$PWD/demo-cicd:/src" "$TRIVY_IMAGE" \
            fs --no-progress --scanners vuln --severity HIGH,CRITICAL --exit-code 0 /src/requirements.txt
          docker run --rm -v "$PWD/demo-cicd:/src" "$TRIVY_IMAGE" \
            fs --no-progress --scanners vuln --severity CRITICAL --exit-code 1 /src/requirements.txt
